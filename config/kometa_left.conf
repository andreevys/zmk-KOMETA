# Left half scans row2col (reversed diodes): columns are pulled down by the
# weak internal pull-downs, so give the matrix time to settle before reading
# inputs and between driving rows, otherwise presses get missed.
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BEFORE_INPUTS=5
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BETWEEN_OUTPUTS=5
